config_builder:
  enabled: true
  script: |
    terragrunt-config-builder | python3 -c 'import json, sys
    roots = ["live"]
    root_tags = [["live", "workflow-tgwf-terragrunt"]]
    c = json.load(sys.stdin)
    def under(d, r):
        return r == "." or d == r or d.startswith(r + "/")
    dirs = {}
    for d, v in c.get("dirs", {}).items():
        if "terragrunt" in v.get("tags", []):
            if not any(under(d, r) for r in roots):
                continue
            for r, t in root_tags:
                if under(d, r) and t not in v["tags"]:
                    v["tags"].append(t)
        dirs[d] = v
    c["dirs"] = dirs
    json.dump(c, sys.stdout)
    '
