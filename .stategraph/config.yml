# Converted from digger.yml by digger-to-stategraph.py 1.0.0.
# Read the conversion report before you commit this file.
engine:
  name: terraform
  version: 1.5.7
when_modified:
  file_patterns: []
  autoplan_draft_pr: false
dirs:
  base:
    workspaces:
      default:
        tags: [base]
        when_modified:
          file_patterns: [base/**/*]
  database:
    workspaces:
      default:
        tags: [database, workflow-db]
        when_modified:
          file_patterns: [database/**/*, modules/**]
          depends_on:
            tag_query: dir:base
  envs/dev:
    workspaces:
      default:
        tags: [envs_dev]
        when_modified:
          file_patterns: [envs/dev/**/*]
          autoapply: true
  envs/prod:
    workspaces:
      default:
        tags: [envs_prod]
        when_modified:
          file_patterns: [envs/prod/**/*]
          autoapply: true
workflows:
- tag_query: workflow-db
  plan:
  - type: env
    name: GREETING
    cmd: [printenv, DIGGER_E2E_GREETING]
    sensitive: true
  - type: env
    name: TF_VAR_tier
    cmd: [printf, '%s', gold]
  - type: init
  - type: run
    cmd: [bash, -eo, pipefail, '${TERRATEAM_ROOT}/.stategraph/scripts/digger-db-plan-1.sh']
  - type: plan
    extra_args: [-var, note=from-digger]
  apply:
  - type: env
    name: GREETING
    cmd: [printenv, DIGGER_E2E_GREETING]
    sensitive: true
  - type: env
    name: TF_VAR_tier
    cmd: [printf, '%s', gold]
  - type: init
  - type: apply
apply_requirements:
  checks:
  - tag_query: database
    approved:
      enabled: true
      any_of: ['*']
      any_of_count: 1
  - tag_query: ''
