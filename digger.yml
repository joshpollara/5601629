projects:
  - name: base
    dir: base
generate_projects:
  blocks:
    - block_name: live
      terragrunt: true
      root_dir: "live/"
      workflow: tgwf
workflows:
  tgwf:
    env_vars:
      commands:
        - name: TG_E2E
          value: from-digger
    plan:
      steps:
        - init
        - run: echo "tg plan in $(basename "$PWD") with $TG_E2E"
        - plan
