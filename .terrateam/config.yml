engine:
  name: tofu
  version: 1.12.2
automerge:
  enabled: false
parameters:
  names:
    destroy:
      values: ['true']
    refresh_only:
      values: ['true']
    target: {}
    replace: {}
    TF_VAR_tier:
      values: ['standard', 'premium']
    TF_LOG:
      values: ['DEBUG']
      fail_if_set: true
  aliases:
    destroy:
      action: plan
      params:
        destroy: 'true'
workflows:
  - tag_query: ''
    plan:
      - type: env
        name: TF_CLI_ARGS_plan
        cmd: ['sh', '${TERRATEAM_ROOT}/scripts/plan-args.sh']
      - type: init
      - type: plan
