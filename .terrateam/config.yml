automerge:
  enabled: true
  require_explicit_apply: true
stacks:
  names:
    base:
      tag_query: 'dir:base'
    database:
      tag_query: 'dir:database'
      rules:
        modified_by:
          - base
        auto_apply: true

access_control:
  enabled: true
  policies:
    - tag_query: ''
      plan: ['*']
      apply: ['*']
      target: ['*']
      destroy: ['*']
