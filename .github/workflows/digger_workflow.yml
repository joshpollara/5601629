name: Digger Workflow
on:
  workflow_dispatch:
    inputs:
      spec:
        required: true
jobs:
  digger-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: diggerhq/digger@v0.6.155
        with:
          digger-spec: ${{ inputs.spec }}
          setup-terraform: true
          terraform-version: v1.5.7
          setup-opentofu: true
          opentofu-version: v1.8.5
