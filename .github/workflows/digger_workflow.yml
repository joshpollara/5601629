name: Digger Workflow
on:
  workflow_dispatch:
    inputs:
      spec:
        required: true
      run_name:
        required: false
run-name: ${{inputs.run_name}}
jobs:
  digger-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      pull-requests: write
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: digger
        uses: diggerhq/digger@v0.6.155
        with:
          digger-spec: ${{ inputs.spec }}
          setup-terraform: true
          terraform-version: v1.5.7
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GREETING_SRC: ${{ vars.DIGGER_E2E_GREETING }}
